name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_KEY: ci-only-synthetic-signing-key
      DATABASE_URL: postgresql://sample:sample@127.0.0.1:5432/approval_sample
      DEBUG: "false"
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: approval_sample
          POSTGRES_USER: sample
          POSTGRES_PASSWORD: sample
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sample -d approval_sample"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Scan application security
        run: bandit -r accounts agents approvals config institutions manage.py
      - name: Audit dependencies
        run: python -m pip_audit -r requirements-dev.txt
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Test
        run: pytest
