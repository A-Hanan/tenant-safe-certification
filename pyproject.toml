[project]
name = "django-approval-sample"
version = "0.1.0"
description = "A small approval workflow sample using synthetic data."
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["_private"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
